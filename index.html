<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThingsKit 价签命令下发 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 16px; }
  .page { width: 100%; max-width: 900px; margin: 0 auto; }
  .login-page { max-width: 460px; padding-top: 8vh; }
  .hidden { display: none; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h2 { font-size: 16px; margin-bottom: 12px; color: #333; border-left: 4px solid #1677ff; padding-left: 8px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head h2 { margin-bottom: 0; }
  .card-head #btnQueryDevices { padding: 6px 12px; font-size: 12px; margin: 0; }
  label { display: inline-block; width: 110px; color: #555; font-size: 13px; }
  input, select { width: 100%; max-width: 320px; padding: 7px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .row { margin-bottom: 10px; }
  button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 4px 8px 4px 0; }
  .btn-primary { background: #1677ff; color: #fff; }
  .btn-green { background: #52c41a; color: #fff; }
  .btn-orange { background: #fa8c16; color: #fff; }
  .btn-device { width: 100%; margin: 0; padding: 12px; background: #fff; color: #333; border: 1px solid #d9d9d9; text-align: left; }
  .btn-device:hover { border-color: #1677ff; background: #f0f7ff; }
  .btn-device.selected { border-color: #1677ff; background: #e6f4ff; box-shadow: 0 0 0 1px #1677ff; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .box { background: #f6f8fa; border: 1px dashed #ccc; border-radius: 4px; padding: 8px; font-size: 12px; word-break: break-all; min-height: 20px; color: #666; }
  textarea { width: 100%; max-width: 520px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: Consolas, monospace; }
  #paramsBox { height: 80px; }
  #resultBox { background: #f6f8fa; border: 1px solid #eee; border-radius: 4px; padding: 10px; font-size: 13px; font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all; min-height: 40px; color: #333; }
  #logBox { background: #1e1e1e; color: #d4d4d4; border-radius: 4px; padding: 10px; font-size: 12px; font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
  #deviceList { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
  .device-name { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .device-meta { display: block; color: #666; font-size: 12px; line-height: 1.6; word-break: break-all; }
  .tip { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 4px; padding: 8px 12px; font-size: 12px; color: #ad6800; margin-bottom: 12px; line-height: 1.6; }
  .ok { color: #52c41a; } .err { color: #f5222d; } .info { color: #1677ff; }

  /* 折叠看板 */
  .tree-item { margin: 2px 0; }
  .tree-row { display: flex; align-items: stretch; gap: 2px; }
  .tree-row .tree-header { flex: 1; }
  .tree-row .tree-actions { display: flex; align-items: stretch; }
  .tree-row .tree-actions button { height: 100%; padding: 6px 12px; }
  .tree-header {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: #fafafa; border: 1px solid #e8e8e8;
    border-radius: 4px; cursor: pointer; user-select: none;
  }
  .tree-header:hover { border-color: #d9d9d9; }
  .tree-header.expanded { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tree-toggle { font-size: 12px; color: #999; width: 16px; }
  .tree-title { font-weight: 600; font-size: 14px; color: #333; flex: 1; }
  .tree-meta { font-size: 12px; color: #888; }
  .tree-actions { display: flex; gap: 6px; }
  .tree-actions button { padding: 4px 10px; font-size: 12px; margin: 0; }
  .tree-actions button:hover { background: #389e0d; }
  .tree-body {
    display: none; padding: 4px 0 6px 10px;
    background: #fff; border-left: 1px solid #e8e8e8;
  }
  .tree-body.open { display: block; }
  /* 节点行:文本编辑行,无框 */
  .node-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0; margin: 1px 0; font-size: 12px; flex: 1;
  }
  .node-row .node-tag { flex-shrink: 0; font-weight: 600; color: #1677ff; min-width: 64px; }
  .node-row input.node-input {
    flex: 1; min-width: 0; max-width: none; padding: 3px 2px; font-size: 12px;
    border: none; border-bottom: 1px solid #ccc; border-radius: 0;
    background: transparent; outline: none;
  }
  .node-row input.node-input:focus { outline: none; border-bottom-color: #1677ff; }
  .node-row input.node-price-input { flex: 1; }
  .node-row input.node-unit-input { flex: 1; }
  .tree-actions .node-send { padding: 3px 10px; font-size: 12px; margin: 0; flex-shrink: 0; white-space: nowrap; min-width: 48px; }
  .node-empty { color: #999; font-size: 13px; padding: 8px; }
</style>
</head>
<body>

<main id="loginPage" class="page login-page">
  <div class="card">
    <h2>ThingsKit</h2>
    <div class="row"><label>平台地址</label><input id="baseUrl" value="https://thingskit.aiotcomm.com.cn"></div>
    <div class="row"><label>用户名</label><input id="username" autocomplete="username" placeholder="请输入平台账号"></div>
    <div class="row"><label>密码</label><input id="password" type="text" inputmode="text" autocomplete="off" placeholder="请输入平台密码"></div>
    <div class="row"><button class="btn-primary" id="btnLogin" onclick="doLogin()">登录</button></div>
  </div>
</main>

<main id="appPage" class="page hidden">
  <div class="card">
    <div class="card-head">
      <h2>价签看板</h2>
      <button class="btn-green" id="btnQueryDevices" onclick="doQueryDevices()" disabled>刷新网关列表</button>
    </div>
    <div class="row">
      <span id="deviceCount" class="device-meta">正在准备查询</span>
    </div>
    <div id="treeContainer"></div>
  </div>

  <div class="card">
    <h2>执行结果</h2>
    <div class="box" id="resultBox" style="min-height:40px"></div>
  </div>

  <div class="card">
    <h2>运行日志</h2>
    <div id="logBox"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let token = null;
let devices = [];

// ===== 登录凭证持久化 =====
const LS_AUTH = 'pt_auth';  // {baseUrl, username, password}

function saveAuth(bUrl, u, p) {
  try { localStorage.setItem(LS_AUTH, JSON.stringify({baseUrl: bUrl, username: u, password: p})); }
  catch (e) {}
}

function loadAuth() {
  try {
    const raw = localStorage.getItem(LS_AUTH);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearAuth() {
  try { localStorage.removeItem(LS_AUTH); } catch (e) {}
}

const TEMPLATES = {};

// ===== 数据模型 =====
// gateways: 从 ThingsKit 查询的网关列表 [{id, name, label, type}]
// nodes: 每个网关下的节点列表 {gwId: [{tag_id, product, price, unit}]}
// expanded: 折叠状态 {gwId: true/false}
let gateways = [];
let nodes = {};
let expanded = {};

// ===== localStorage 持久化 =====
const LS_PREFIX = 'pt_nodes_';      // pt_nodes_{gwId}
const LS_EXPANDED = 'pt_expanded';  // 折叠状态

function saveNodes(gwId) {
  try { localStorage.setItem(LS_PREFIX + gwId, JSON.stringify(nodes[gwId] || [])); }
  catch (e) { log('err', '保存节点失败: ' + e.message); }
}

function loadNodes(gwId) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + gwId);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveExpanded() {
  try { localStorage.setItem(LS_EXPANDED, JSON.stringify(expanded)); }
  catch (e) {}
}

function loadExpanded() {
  try {
    const raw = localStorage.getItem(LS_EXPANDED);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function log(kind, msg) {
  const box = $('logBox');
  const line = document.createElement('div');
  line.className = kind;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function baseUrl() {
  const u = $('baseUrl').value.trim().replace(/\/+$/, '');
  if (!u) { log('err', '请先填写平台地址'); throw new Error('no base url'); }
  return u;
}

async function api(path, opts) {
  const url = baseUrl() + path;
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['X-Authorization'] = 'Bearer ' + token;
  const cfg = Object.assign({}, opts, { headers });
  log('info', `→ ${cfg.method || 'GET'} ${url}`);
  if (cfg.body) log('info', path === '/api/auth/login' ? '  body: 登录凭据已隐藏' : `  body: ${cfg.body}`);
  try {
    const resp = await fetch(url, cfg);
    const text = await resp.text();
    log('info', `← HTTP ${resp.status}`);
    if (text) log('info', path === '/api/auth/login' ? '  resp: 登录凭据已隐藏' : `  resp: ${text}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${text || resp.statusText}`);
    return text ? JSON.parse(text) : null;
  } catch (e) {
    log('err', `✗ 请求失败: ${e.message}`);
    throw e;
  }
}

async function doLogin() {
  const u = $('username').value.trim(), p = $('password').value;
  if (!u || !p) {
    log('err', '请填写用户名和密码');
    return;
  }
  const button = $('btnLogin');
  button.disabled = true;
  try {
    const data = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username: u, password: p })
    });
    token = data.token;
    if (!token) throw new Error('登录响应中没有 token');
    saveAuth(baseUrl(), u, p);
    $('password').value = '';
    $('loginPage').classList.add('hidden');
    $('appPage').classList.remove('hidden');
    log('ok', '登录成功');
    $('btnQueryDevices').disabled = false;
    // 页面加载时恢复折叠状态
    expanded = loadExpanded();
    await doQueryDevices();
    // 登录后自动展开有节点数据的网关
    let autoExpanded = 0;
    gateways.forEach(gw => {
      const saved = loadNodes(gw.id);
      if (saved && saved.length > 0 && !expanded[gw.id]) {
        nodes[gw.id] = saved;
        expanded[gw.id] = true;
        autoExpanded++;
      } else if (saved) {
        nodes[gw.id] = saved;
      }
    });
    if (autoExpanded > 0) {
      saveExpanded();
      renderTree();
      log('info', `恢复了 ${autoExpanded} 个网关的节点数据`);
    }
  } catch (e) {
    log('err', `登录失败: ${e.message}`);
    token = null;
    devices = [];
    $('btnQueryDevices').disabled = true;
  } finally {
    button.disabled = false;
  }
}

function getDeviceId(device) {
  if (!device) return '';
  if (typeof device.id === 'string') return device.id;
  return device.id && typeof device.id.id === 'string' ? device.id.id : '';
}

function isGateway(device) {
  const identity = `${device.name || ''} ${device.label || ''}`.toUpperCase();
  return identity.includes('GW');
}

function renderTree() {
  const container = $('treeContainer');
  container.replaceChildren();

  if (gateways.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'box';
    empty.textContent = '尚未查询到网关设备';
    container.appendChild(empty);
    return;
  }

  gateways.forEach(gw => {
    const id = gw.id;
    const isOpen = !!expanded[id];
    const gwNodes = nodes[id] || [];
    const nodeCount = gwNodes.length;

    const item = document.createElement('div');
    item.className = 'tree-item';

    // 折叠头
    const header = document.createElement('div');
    header.className = 'tree-header' + (isOpen ? ' expanded' : '');

    const toggle = document.createElement('span');
    toggle.className = 'tree-toggle';
    toggle.textContent = isOpen ? '▼' : '▶';

    const title = document.createElement('span');
    title.className = 'tree-title';
    title.textContent = gw.name || id;

    const meta = document.createElement('span');
    meta.className = 'tree-meta';
    meta.textContent = nodeCount > 0 ? `${nodeCount} 个节点` : '未查询';

    const actions = document.createElement('span');
    actions.className = 'tree-actions';

    const btnQuery = document.createElement('button');
    btnQuery.className = 'btn-green';
    btnQuery.textContent = '查询节点';
    btnQuery.onclick = (e) => { e.stopPropagation(); refreshNodes(id, gw.name || id); };

    actions.append(btnQuery);

    // 点击 header 折叠/展开,并选中该网关
    header.onclick = () => {
      expanded[id] = !expanded[id];
      saveExpanded();
      selectDevice(id, gw.name || id);
      renderTree();
    };

    header.append(toggle, title, meta);

    // 折叠体
    const body = document.createElement('div');
    body.className = 'tree-body' + (isOpen ? ' open' : '');

    if (nodeCount === 0) {
      const empty = document.createElement('div');
      empty.className = 'node-empty';
      empty.textContent = '（尚未查询节点，点击"查询节点"刷新）';
      body.appendChild(empty);
    } else {
      gwNodes.forEach((n, idx) => {
        const row = document.createElement('div');
        row.className = 'node-row';

        const tag = document.createElement('span');
        tag.className = 'node-tag';
        tag.textContent = n.tag_id || '-';

        const nameInput = document.createElement('input');
        nameInput.className = 'node-input';
        nameInput.type = 'text';
        nameInput.value = n.product || '';
        nameInput.placeholder = '商品名称';

        const priceInput = document.createElement('input');
        priceInput.className = 'node-input node-price-input';
        priceInput.type = 'number';
        priceInput.step = '0.01';
        priceInput.value = (n.price != null) ? n.price : '';
        priceInput.placeholder = '价格';

        const unitInput = document.createElement('input');
        unitInput.className = 'node-input node-unit-input';
        unitInput.type = 'text';
        unitInput.value = n.unit || '';
        unitInput.placeholder = '单位';

        const btnSend = document.createElement('button');
        btnSend.className = 'btn-orange node-send';
        btnSend.textContent = '下发';
        btnSend.onclick = (e) => {
          e.stopPropagation();
          sendNodeUpdate(id, gw.name || id, n.tag_id || '-', {
            product: nameInput.value.trim(),
            price: priceInput.value !== '' ? Number(priceInput.value) : null,
            unit: unitInput.value.trim()
          });
        };

        // 节点字段行(文本编辑行,无框)
        row.append(tag, nameInput, priceInput, unitInput);

        // 下发按钮与节点行并行,不嵌套
        const nodeActions = document.createElement('div');
        nodeActions.className = 'tree-actions';
        nodeActions.append(btnSend);

        const nodeRow = document.createElement('div');
        nodeRow.className = 'tree-row';
        nodeRow.append(row, nodeActions);
        body.appendChild(nodeRow);
      });
    }

    // header 和 actions 左右并行同一行,body 在下方
    const row = document.createElement('div');
    row.className = 'tree-row';
    row.append(header, actions);
    item.append(row, body);
    container.appendChild(item);
  });
}

function selectDevice(id, name) {
  if (!id) {
    log('err', '所选设备没有有效 UUID');
    return;
  }
  log('ok', `✓ 已选择网关 ${name} (${id})`);
}

async function doQueryDevices() {
  if (!token) { log('err', '请先登录'); return; }

  const button = $('btnQueryDevices');
  button.disabled = true;
  $('deviceCount').textContent = '正在查询...';

  try {
    const allDevices = [];
    let page = 0;
    let totalPages = 1;

    do {
      const data = await api(`/api/tenant/devices?pageSize=100&page=${page}`, { method: 'GET' });
      const pageDevices = Array.isArray(data) ? data : (Array.isArray(data && data.data) ? data.data : []);
      allDevices.push(...pageDevices);
      totalPages = Number.isInteger(data && data.totalPages) ? data.totalPages : 1;
      page += 1;
    } while (page < totalPages);

    const gwDevices = allDevices.filter(device => isGateway(device) && getDeviceId(device));

    // 对每个网关下发 ping 连通测试,只保留 ping 成功的
    $('deviceCount').textContent = `连通测试中... (0/${gwDevices.length})`;
    const onlineDevices = [];
    for (let i = 0; i < gwDevices.length; i++) {
      const d = gwDevices[i];
      const id = getDeviceId(d);
      const name = d.name || id;
      $('deviceCount').textContent = `连通测试中... (${i}/${gwDevices.length})`;
      const online = await doPingGateway(id, name);
      if (online) {
        onlineDevices.push(d);
        log('ok', `✓ ${name} 在线`);
      } else {
        log('err', `✗ ${name} 离线,不显示`);
      }
    }

    // 网关列表刷新:增删对比,保留已有节点数据
    const newIds = new Set(onlineDevices.map(getDeviceId));
    Object.keys(nodes).forEach(oldId => {
      if (!newIds.has(oldId)) {
        delete nodes[oldId];
        try { localStorage.removeItem(LS_PREFIX + oldId); } catch (e) {}
      }
    });

    gateways = onlineDevices.map(d => ({
      id: getDeviceId(d),
      name: d.name || getDeviceId(d),
      label: d.label || '',
      type: d.type || ''
    }));

    // 恢复每个网关的折叠状态和节点数据
    gateways.forEach(gw => {
      if (!(gw.id in expanded)) expanded[gw.id] = false;
      if (!nodes[gw.id]) {
        const saved = loadNodes(gw.id);
        if (saved) nodes[gw.id] = saved;
      }
    });
    saveExpanded();

    $('deviceCount').textContent = `查询到 ${gateways.length} 个网关`;
    renderTree();

    if (gateways.length === 1) {
      selectDevice(gateways[0].id, gateways[0].name);
    }
    log('ok', `✓ 设备查询完成,${gwDevices.length} 个 GW 设备,${gateways.length} 个在线`);
  } catch (e) {
    gateways = [];
    $('deviceCount').textContent = '查询失败';
    renderTree();
  } finally {
    button.disabled = !token;
  }
}

// 查询指定网关的节点列表,用新结果完全替换
async function refreshNodes(gwId, gwName) {
  if (!token || !gwId) return;
  log('info', `→ 查询网关 ${gwName || gwId} 的节点列表...`);
  try {
    const path = `/api/rpc/twoway/${gwId}`;
    const requestBody = { method: 'list_tags', params: {} };
    const data = await api(path, { method: 'POST', body: JSON.stringify(requestBody) });

    const freshTags = Array.isArray(data && data.tags) ? data.tags : [];
    nodes[gwId] = freshTags.map(nt => ({
      tag_id: nt.tag_id || '-',
      product: nt.product || '-',
      price: (nt.price != null) ? nt.price : null,
      unit: nt.unit || ''
    }));
    saveNodes(gwId);
    expanded[gwId] = true;  // 查询后自动展开
    saveExpanded();
    renderTree();

    log('ok', `✓ 网关 ${gwName || gwId} 查询完成: ${freshTags.length} 个节点`);
  } catch (e) {
    log('err', `✗ 查询节点失败: ${e.message}`);
  }
}

// 对单个网关执行 ping 连通测试,返回是否在线
async function doPingGateway(gwId, gwName) {
  if (!token || !gwId) return false;
  try {
    const path = `/api/rpc/twoway/${gwId}`;
    const requestBody = { method: 'ping', params: {} };
    const data = await api(path, { method: 'POST', body: JSON.stringify(requestBody) });
    const ok = data && data.status === 'ok' &&
               (data.message === 'pong' || data.message === 'ok');
    return ok;
  } catch (e) {
    return false;
  }
}

// 节点下发:update_tag 命令，带 tag_id/product/price/unit
async function sendNodeUpdate(gwId, gwName, tagId, fields) {
  if (!token || !gwId || !tagId) return;
  const params = { tag_id: tagId };
  if (fields.product != null) params.product = fields.product;
  if (fields.price != null) params.price = fields.price;
  if (fields.unit != null) params.unit = fields.unit;
  $('resultBox').textContent = `等待下发到节点 ${tagId}...`;
  log('info', `→ 下发到 ${gwName || gwId} / ${tagId}: ${JSON.stringify(params)}`);
  try {
    const path = `/api/rpc/twoway/${gwId}`;
    const requestBody = { method: 'update_tag', params };
    const data = await api(path, { method: 'POST', body: JSON.stringify(requestBody) });
    const ok = data && (data.status === 'ok' || data.status === 'success');
    $('resultBox').textContent = ok
      ? `修改成功（节点 ${tagId}）`
      : `修改失败（节点 ${tagId}）${data && data.message ? ': ' + data.message : ''}`;
    log(ok ? 'ok' : 'err', ok ? `✓ ${tagId} 修改成功` : `✗ ${tagId} 修改失败`);
    // 成功后刷新该网关节点列表，反映新值
    if (ok) await refreshNodes(gwId, gwName);
  } catch (e) {
    $('resultBox').textContent = `请求失败: ${e.message}`;
    log('err', `✗ 下发失败: ${e.message}`);
  }
}

// 把网关返回的 JSON 转义成人类可读的执行结果
function renderResult(method, data, err) {
  // 请求本身失败
  if (err) {
    if (method === 'ping') return `网关离线\n（请求失败: ${err}）`;
    return `请求失败: ${err}`;
  }

  // 没拿到网关应答（平台只返回 rpcId，说明走的是异步接口）
  if (data && data.rpcId && !data.status && !data.tags) {
    return '平台已受理命令，但未收到网关应答\n（请将命令改为同步 twoway 方式）';
  }

  if (method === 'ping') {
    const ok = data && data.status === 'ok' &&
               (data.message === 'pong' || data.message === 'ok');
    if (ok) return `网关在线`;
    const reason = (data && data.message) ? data.message : '无应答';
    return `网关离线\n（${reason}）`;
  }

  // update_price / update_name / update_tag
  if (data && (data.status === 'ok' || data.status === 'success')) {
    const tag = data.tag_id ? `（节点 ${data.tag_id}）` : '';
    return `修改成功${tag}`;
  }
  if (data && data.status === 'error') {
    const tag = data.tag_id ? `（节点 ${data.tag_id}）` : '';
    const reason = data.message ? `: ${data.message}` : '';
    return `修改失败${tag}${reason}`;
  }

  // 兜底：无法识别的格式，原样显示
  return `未知响应格式:\n${JSON.stringify(data, null, 2)}`;
}

// 页面加载时填充上次的登录凭证(不自动登录,需点击登录)
(function prefillAuth() {
  const saved = loadAuth();
  if (!saved) { return; }
  if (saved.baseUrl) { $('baseUrl').value = saved.baseUrl; }
  if (saved.username) { $('username').value = saved.username; }
  if (saved.password) { $('password').value = saved.password; }
})();
</script>
